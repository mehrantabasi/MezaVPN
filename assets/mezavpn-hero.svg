<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">MezaVPN</title>
  <desc id="desc">A clearer way to connect on Android and Windows</desc>
  <defs>
    <linearGradient id="panel" x1="40" y1="20" x2="1240" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C2036"/>
      <stop offset="0.54" stop-color="#091727"/>
      <stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#62E6B5"/>
      <stop offset="1" stop-color="#63A8FF"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop stop-color="#63A8FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#63A8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow">
      <stop stop-color="#62E6B5" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#62E6B5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1280" height="460" rx="32" fill="url(#panel)"/>
  <circle cx="1160" cy="10" r="370" fill="url(#blueGlow)"/>
  <circle cx="30" cy="470" r="310" fill="url(#mintGlow)"/>

  <g transform="translate(76 78)">
    <image href="mezavpn-logo.png" width="124" height="124" preserveAspectRatio="xMidYMid meet" filter="url(#shadow)"/>
    <text x="158" y="66" fill="#F7FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="760">MezaVPN</text>
    <text x="160" y="108" fill="#A9BCD2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Private. Fast. Effortless.</text>

    <text x="0" y="222" fill="#F7FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="680">A clearer way to connect.</text>
    <text x="0" y="264" fill="#A9BCD2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Simple controls. Honest status. Everyday reliability.</text>

    <g transform="translate(0 294)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">
      <rect width="202" height="48" rx="24" fill="#62E6B5" fill-opacity="0.12" stroke="#62E6B5" stroke-opacity="0.48"/>
      <circle cx="28" cy="24" r="7" fill="#62E6B5"/>
      <text x="46" y="30" fill="#C9FAE8">Android · Available</text>

      <rect x="218" width="232" height="48" rx="24" fill="#63A8FF" fill-opacity="0.11" stroke="#63A8FF" stroke-opacity="0.42"/>
      <circle cx="246" cy="24" r="7" fill="#63A8FF"/>
      <text x="264" y="30" fill="#D3E9FF">Windows · In development</text>
    </g>
  </g>

  <g transform="translate(932 66)" filter="url(#shadow)">
    <circle cx="140" cy="164" r="132" fill="#0D1B2D" stroke="#2E5279" stroke-width="3"/>
    <circle cx="140" cy="164" r="102" fill="none" stroke="#63A8FF" stroke-opacity="0.14" stroke-width="18"/>
    <circle cx="140" cy="164" r="76" fill="url(#brand)"/>
    <path d="M140 119v55m-39-32a55 55 0 1 0 78 0" fill="none" stroke="#07111F" stroke-width="14" stroke-linecap="round"/>
    <rect x="53" y="321" width="174" height="42" rx="21" fill="#62E6B5" fill-opacity="0.10" stroke="#62E6B5" stroke-opacity="0.34"/>
    <circle cx="78" cy="342" r="6" fill="#62E6B5"/>
    <text x="94" y="348" fill="#C9FAE8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Ready when you are</text>
  </g>
</svg>
